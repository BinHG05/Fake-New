# configs/development.yaml
# Lightweight configuration for fast local debugging and smoke tests

dataset:
  metadata: data/all_merged_binary.jsonl
  graph_dir: data/processed_graphs_v3
  label_mode: binary
  id_column: id
  label_column: label_binary
  split_column: split

model:
  type: multimodal_cascade_gnn
  text_dim: 768
  image_dim: 1025
  fusion_dim: 128
  hidden_dim: 128
  num_classes: 2
  num_gnn_layers: 2
  dropout: 0.1
  fusion: cross_attention
  gnn: gat
  learn_missing_image_emb: false

training:
  seed: 42
  batch_size: 16
  epochs: 2
  limit: 64
  learning_rate: 0.001
  weight_decay: 0.001
  patience: 3
  selection_metric: acc
  fake_class_weight: 1.0
  focal_gamma: 2.0
  label_smoothing: 0.0
  checkpoint_dir: artifacts/checkpoints
  checkpoint_name: dev_multimodal_cascade_gnn.pt

evaluation:
  threshold: 0.5
  primary_metric: accuracy
  save_predictions: true
  output_dir: artifacts/metrics
  figures_dir: artifacts/figures
  predictions_dir: artifacts/predictions

serving:
  checkpoint: artifacts/checkpoints/multimodal_cascade_gnn_binary.pt
  host: 127.0.0.1
  port: 5000
  uncertain_threshold: 0.15
  temperature: 1.0
  allow_fallback: false

